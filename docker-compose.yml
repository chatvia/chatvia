services:
    postgres:
        image: tensorchord/vchord-suite:pg18-latest
        container_name: postgres18
        env_file: .env
        environment:
            POSTGRES_DB: ${DB_DATABASE:-chatvia}
            POSTGRES_USER: ${DB_USERNAME:-sail}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
        volumes:
            - ./postgress:/var/lib/postgresql
        networks:
            - db_network
        ports:
            - '${FORWARD_PGVECTOR_PORT:-5432}:5432'

networks:
    db_network:
        driver: bridge
