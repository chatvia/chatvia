name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:
  workflow_dispatch:

# Read-only token, and no secrets anywhere in this workflow, so it runs the same
# for pull requests from forks.
permissions:
  contents: read

# A new push to the same pull request cancels its older run. Runs on branches
# are never cancelled. The group includes the caller's workflow name, so a run
# started through workflow_call never cancels a normal run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    services:
      postgres:
        # Same image and tag as docker-compose.yml; keep them in sync.
        image: tensorchord/vchord-suite:pg18-20260501
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: chatvia
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U chatvia -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, intl, gd, exif, iconv, fileinfo, redis
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Create storage directories
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/testing
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      - name: Copy environment file
        run: cp .env.testing .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
         node-version: '22'
         cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Prepare Laravel Application
        run: |
          php artisan key:generate --force
          php artisan key:generate --force --env=testing

      # Every gate a contributor runs locally before a pull request: composer
      # validate + audit, npm audit, Pint, Rector, PHPStan, Prettier, ESLint,
      # vue-tsc, the i18n check and the Pest suite. It never changes files. The
      # test run installs the Postgres extensions, migrates and seeds the
      # `testing` database by itself, so there is no separate migrate step.
      - name: Run CI checks
        run: composer ci:check

      - name: Build assets
        run: npm run build

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The installer, the management tool it copies next to an install, and
      # the scripts inside the image. ShellCheck comes with the runner.
      - name: ShellCheck
        run: shellcheck install.sh docker/manage docker/app/bin/* docker/app/entrypoint.d/*.sh

  bash-3:
    name: Installer on bash 3.2
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # macOS still ships bash 3.2 as /bin/bash, and the installer and the
      # management tool run on it there. This only parses them: it catches
      # syntax that needs a newer bash, not every runtime difference.
      - name: Parse with bash 3.2
        run: |
          /bin/bash --version
          /bin/bash -n install.sh
          /bin/bash -n docker/manage
