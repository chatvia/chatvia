name: Deploy to Bunny CDN

on:
  push:
    tags:
      - 'v*'  # Matches tags starting with 'v', like v0.1, v1.0, etc.

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Extract version from tag name
        id: extract_version
        run: |
          # Extract version from tag name (e.g. v1.0 -> 1.0)
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with extracted version
        run: |
          echo "VITE_APP_VERSION=$VERSION" > .env
          echo "NODE_ENV=production" >> .env
          echo "VITE_API_URL=${{ vars.API_URL }}" >> .env
          echo "VITE_SCRIPT_URL=${{ vars.BUNNY_CDN_BASE_URL }}/widget" >> .env
          echo "VITE_REVERB_HOST=${{ vars.REVERB_HOST }}" >> .env
          echo "VITE_REVERB_PORT=${{ vars.REVERB_PORT }}" >> .env
          echo "VITE_REVERB_APP_KEY=${{ vars.REVERB_APP_KEY }}" >> .env
          cat .env
          npm run build:prod

      - name: Deploy to Bunny CDN via HTTP API
        run: |
          # For each file in the dist directory, upload it to BunnyCDN
          find ./dist -type f -print0 | while IFS= read -r -d $'\0' file
          do
            # Extract the relative path within the dist directory
            relative_path="${file#./dist/}"
            # Construct the BunnyCDN API URL with widget folder structure
            bunny_api_url="https://storage.bunnycdn.com/${{ vars.BUNNY_STORAGE_ZONE_NAME }}/widget/${relative_path}"
            # Upload the file using curl
            echo "Uploading $file to $bunny_api_url"
            response=$(curl --request PUT \
              --url "$bunny_api_url" \
              --header "AccessKey: ${{ secrets.BUNNY_STORAGE_API_KEY }}" \
              --data-binary "@$file" \
              --write-out "%{http_code}" \
              --silent \
              --output /dev/null)

            echo "Upload response code for $file: $response"

            if [ $response != 200 ] && [ $response != 201 ]; then
                echo "Error uploading $file. Response code: $response"
                exit 1
            fi
          done

      - name: Purge Bunny CDN cache
        run: |
          # List of files to purge from CDN cache
          files_to_purge=(
            "${{ vars.BUNNY_CDN_BASE_URL }}/widget/embed.js"
            "${{ vars.BUNNY_CDN_BASE_URL }}/widget/version.json"
          )

          # Loop through each file and purge it from the CDN cache
          for file_url in "${files_to_purge[@]}"; do
            echo "Purging CDN cache for: $file_url"

            response=$(curl --request POST \
                 --url "https://api.bunny.net/purge?url=$file_url" \
                 --header "AccessKey: ${{ secrets.BUNNY_API_KEY }}" \
                 --write-out "%{http_code}" \
                 --silent \
                 --output /dev/null)

            echo "Purge CDN cache response code for $file_url: $response"

            if [ "$response" != "200" ] && [ "$response" != "201" ]; then
              echo "Error purging Bunny CDN cache for $file_url. Response code: $response"
              exit 1
            fi
          done
