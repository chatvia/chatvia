# Replaces the base image's security.conf. The base file also adds
# X-Frame-Options and Strict-Transport-Security to every response, but the app
# sets those itself (App\Http\Middleware\Web\ContentSecurityPolicy): hosted
# chats must load inside iframes on other sites, and HSTS only belongs on
# HTTPS. So only the file blocks are kept here.

# Hidden files and folders, except /.well-known/ (RFC 8615).
location ~ /\.(?!well-known) {
    deny all;
}

# Backup, config and log files that may expose secrets.
location ~* (?:#.*#|\.(?:bak|conf|config|dist|inc|ini|log|sh|sql|sw[op])|~)$ {
    deny all;
}
