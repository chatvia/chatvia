# The chat widget (Shakomako), built into public/shakomako. Other sites
# load it, and embed.js reads version.json with fetch(), so every file allows
# any origin.
#
# - embed.js: sites paste its address into their pages once. Short cache.
# - version.json: names the current release. Checked on every load.
# - {release}/: a release folder never changes once built. Cached for a year.

location ^~ /shakomako/ {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
}

location = /shakomako/embed.js {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "public, max-age=300" always;
    try_files $uri =404;
}

location = /shakomako/version.json {
    add_header Access-Control-Allow-Origin "*" always;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
}
