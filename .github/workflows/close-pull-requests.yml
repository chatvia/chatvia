name: Close pull requests

# This project does not accept pull requests from outside: people describe a
# bug or a feature in an issue, and a maintainer makes the change. This
# workflow closes every pull request opened by someone without write access,
# with a comment that points to the issue forms. Pull requests from the
# maintainers (OWNER, MEMBER, COLLABORATOR) and from Dependabot stay open.
#
# The repository setting (Settings → General → Features → Pull requests →
# "Collaborators only") stops most of them before they are opened; this
# workflow is the safety net.
#
# pull_request_target runs in the context of this repository, so the token can
# close a pull request from a fork. It never checks out or runs the pull
# request's code, and reads nothing from it but its number.
on:
  pull_request_target:
    types:
      - opened
      - reopened

permissions:
  pull-requests: write

jobs:
  close:
    name: Close
    if: >-
      !contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association)
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Close the pull request with a comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          ISSUES_URL: ${{ github.server_url }}/${{ github.repository }}/issues/new/choose
          CONTRIBUTING_URL: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.repository.default_branch }}/CONTRIBUTING.md
        run: |
          gh pr close "$NUMBER" --comment "Thank you for your pull request.

          This project does not accept pull requests, so this one was closed automatically. A maintainer writes every change.

          Please open an issue instead and describe the bug or the feature: $ISSUES_URL
          If you already know the fix, describe it in the issue. A short code snippet is welcome there.

          See [CONTRIBUTING.md]($CONTRIBUTING_URL) for more."
