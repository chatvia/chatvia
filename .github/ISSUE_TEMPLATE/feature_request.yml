name: Feature request
description: Suggest a new feature or an improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for the idea. Please search the existing issues first, in case someone already asked for it.
        This project does not accept pull requests. Describe the feature here, and a maintainer will build it if it fits the project.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation and why the current behaviour is not enough.
      placeholder: When I ..., I cannot ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: Describe the feature or change you have in mind. Screenshots or sketches help.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Other ways to solve the problem, or workarounds you use today.
    validations:
      required: false

  - type: textarea
    id: approach
    attributes:
      label: Suggested approach
      description: If you have an idea of how to build it (which part of the code, which settings), describe it here. A short code snippet is welcome.
    validations:
      required: false
