# Local development services for Chatvia: PostgreSQL (with the vector and BM25
# search extensions), Redis and Mailpit. The Laravel app, queue worker, Reverb
# and Vite run on your machine; see README.md.
#
#   docker compose up -d      start the services
#   docker compose ps         show their health
#   docker compose down       stop them (data is kept)
#   docker compose down -v    stop them and delete all data
#
# Each host port can be changed in your shell or in .env, for example
# FORWARD_DB_PORT=5433 when port 5432 is already in use.

name: chatvia

services:
  postgres:
    # PostgreSQL 18 with pgvector, VectorChord (vchord), VectorChord-bm25 and
    # pg_tokenizer. Same image and tag as CI (.github/workflows/tests.yml); keep
    # them in sync. The dated tag is what `pg18-latest` pointed to when it was
    # pinned. The image's default command preloads the extensions, so do not
    # override `command`.
    image: tensorchord/vchord-suite:pg18-20260501
    environment:
      POSTGRES_DB: chatvia
      POSTGRES_USER: chatvia
      # Development only. phpunit.xml and .env.testing use the same values.
      POSTGRES_PASSWORD: password
      TZ: UTC
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/.
      - pgdata:/var/lib/postgresql
      # Creates the `testing` database on first start (empty volume only).
      - ./docker/postgres/create-testing-database.sql:/docker-entrypoint-initdb.d/10-create-testing-database.sql:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatvia -d chatvia"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    ports:
      - "${FORWARD_REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    # Catches every e-mail the app sends. Web UI: http://localhost:8025
    image: axllent/mailpit:v1.31
    ports:
      - "${FORWARD_MAILPIT_PORT:-1025}:1025"
      - "${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pgdata:
    name: chatvia-pgdata
  redisdata:
    name: chatvia-redisdata
