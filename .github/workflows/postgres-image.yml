name: Postgres image

# Builds the Postgres image (docker/postgres/Dockerfile: pgvector,
# pg_textsearch, pg_partman) and pushes it to the GitHub Container Registry
# whenever the Dockerfile changes. Publishes two tags: the moving `18`, which
# installs use (docker/compose.yaml), and the pinned `18-r<IMAGE_REVISION>`
# that docker-compose.yml and .github/workflows/tests.yml reference. A pinned
# tag is never overwritten: without a new IMAGE_REVISION in the Dockerfile
# (bump those two pins with it), this run builds nothing and warns.
on:
  push:
    branches:
      - main
    paths:
      - docker/postgres/Dockerfile
      - .github/workflows/postgres-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: postgres-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/postgres

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the image revision from the Dockerfile
        id: version
        run: |
          revision=$(sed -n 's/^ARG IMAGE_REVISION=//p' docker/postgres/Dockerfile)
          echo "tag=18-r$revision" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite a published tag
        id: published
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "::warning::$IMAGE:${{ steps.version.outputs.tag }} is already published, so nothing is built. To publish a change to the image, bump IMAGE_REVISION in docker/postgres/Dockerfile."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: docker/postgres
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:18
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
