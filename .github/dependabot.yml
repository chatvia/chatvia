version: 2

updates:
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      composer-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    ignore:
      # TypeScript 7 (the Go compiler) has no JS API yet, and vue-tsc and
      # typescript-eslint need one: stay on 6.x until they support 7.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # marked-katex-extension only supports katex below 0.19.
      - dependency-name: katex
        versions:
          - ">=0.19.0"
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
