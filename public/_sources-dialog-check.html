<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sources dialog check</title>
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.11"></script>
<style type="text/tailwindcss">
@custom-variant dark (&:where(.dark, .dark *));
@theme inline {
  --color-background: var(--background);
  --color-foreground: var(--foreground);
  --color-secondary: var(--secondary);
  --color-secondary-foreground: var(--secondary-foreground);
  --color-muted-foreground: var(--muted-foreground);
  --color-border: var(--border);
}
:root { --background: hsl(0 0% 100%); --foreground: hsl(0 0% 3.9%); --secondary: hsl(0 0% 92.1%); --secondary-foreground: hsl(0 0% 9%); --muted-foreground: hsl(0 0% 45.1%); --border: hsl(0 0% 92.8%); }
.dark { --background: hsl(0 0% 3.9%); --foreground: hsl(0 0% 98%); --secondary: hsl(0 0% 14.9%); --secondary-foreground: hsl(0 0% 98%); --muted-foreground: hsl(0 0% 63.9%); --border: hsl(0 0% 14.9%); }
* { border-color: var(--border); }
body { background: var(--background); color: var(--foreground); }
</style>
</head>
<body class="min-h-screen">
<div id="root"></div>
<script>
const q = new URLSearchParams(location.search);
const after = q.get('v') !== 'before';
if (q.get('theme') === 'dark') document.documentElement.classList.add('dark');
document.documentElement.dir = q.get('dir') === 'rtl' ? 'rtl' : 'ltr';

const sources = after
  ? [
      { label: 'أعلن المتحدث العسكري باسم جماعة أنصار الله الحوثية، يحيى سريع، الأربعاء، استهداف…', passages: 5 },
      { label: 'A very long English handbook file name for the returns and refunds policy.pdf (Page 12)', passages: 2, url: true },
      { label: 'Short.docx', passages: 1 },
      { label: 'دليل قصير.pdf', passages: 1 },
    ]
  : Array.from({ length: 5 }, () => ({ label: 'أعلن المتحدث العسكري باسم جماعة أنصار الله الحوثية، يحيى سريع، الأربعاء، استهداف…', passages: 1 }));

const contentClass = 'bg-background fixed top-[50%] left-[50%] z-50 grid w-full translate-x-[-50%] translate-y-[-50%] gap-4 rounded-lg border p-6 shadow-lg max-h-[80vh] '
  + (after ? 'max-w-[calc(100%-2rem)] sm:max-w-xl' : 'max-w-xl sm:max-w-lg');
const scrollClass = 'relative max-h-[60vh] pe-4' + (after ? ' min-w-0' : '');
const liClass = 'flex items-center gap-3 rounded-lg border p-3' + (after ? ' min-w-0' : '');
const spanClass = 'min-w-0 flex-1 truncate text-sm font-medium' + (after ? ' [text-align:match-parent]' : '');

const rows = sources.map((s, i) => `
  <li class="${liClass}">
    <span class="bg-secondary text-secondary-foreground inline-flex shrink-0 rounded-md px-2 py-0.5 text-xs font-semibold">${i + 1}</span>
    <span class="text-muted-foreground h-4 w-4 shrink-0">≡</span>
    <span ${after ? 'dir="auto"' : ''} class="${spanClass}" title="${s.label}">${s.label}</span>
    ${after && s.passages > 1 ? `<span class="text-muted-foreground shrink-0 text-xs">${s.passages} passages</span>` : ''}
    ${s.url ? '<a class="text-muted-foreground shrink-0">↗</a>' : ''}
  </li>`).join('');

document.getElementById('root').innerHTML = `
  <div class="fixed inset-0 z-50 bg-black/80"></div>
  <div id="dialog" class="${contentClass}">
    <div class="flex flex-col gap-2 text-center sm:text-start">
      <h2 class="flex items-center gap-2 text-lg font-semibold">Knowledge Sources</h2>
      <p class="text-muted-foreground text-sm">${sources.length} sources used to generate this response</p>
    </div>
    <div id="scroll" dir="${document.documentElement.dir}" class="${scrollClass}">
      <div class="size-full overflow-y-hidden overflow-x-hidden">
        <ul class="space-y-2">${rows}</ul>
      </div>
    </div>
  </div>`;
</script>
</body>
</html>
