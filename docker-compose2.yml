    minio:
        image: 'minio/minio:latest'
        ports:
            - '${FORWARD_MINIO_PORT:-9000}:9000'
            - '${FORWARD_MINIO_CONSOLE_PORT:-8900}:8900'
        environment:
            MINIO_ROOT_USER: sail
            MINIO_ROOT_PASSWORD: password
        volumes:
            - 'chatvia-minio:/data'
        networks:
            - chatvia
        command: 'minio server /data --console-address ":8900"'
        healthcheck:
            test:
                - CMD
                - mc
                - ready
                - local
            retries: 3
            timeout: 5s

    elasticsearch:
        image: docker.elastic.co/elasticsearch/elasticsearch:9.0.2
        environment:
            - cluster.name=chatvia-local
            - node.name=chatvia-local-node
            - discovery.type=single-node

            # Memory settings - optimized for local development (8-16GB RAM machines)
            - "ES_JAVA_OPTS=-Xms2g -Xmx4g"  # 4GB heap max for local development

            # Security settings (disabled for local development)
            - xpack.security.enabled=false
            - xpack.security.http.ssl.enabled=false
            - xpack.security.transport.ssl.enabled=false

            # Basic performance settings for local development
            - indices.memory.index_buffer_size=20%
            - indices.queries.cache.size=10%
            - indices.fielddata.cache.size=15%

            # Network settings
            - network.host=0.0.0.0
            - http.port=9200
            - transport.port=9300

            # Basic cluster settings
            - action.auto_create_index=true

        ulimits:
            memlock:
                soft: -1
                hard: -1
            nofile:
                soft: 65536
                hard: 65536

        volumes:
            - chatvia-elasticsearch:/usr/share/elasticsearch/data
            - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro

        ports:
            - "9200:9200"
            - "9300:9300"

        networks:
            - chatvia

        restart: unless-stopped

        # Resource limits optimized for local development
        deploy:
            resources:
                limits:
                    memory: 6G  # Reasonable for local development
                reservations:
                    memory: 2G

    kibana:
        image: docker.elastic.co/kibana/kibana:9.0.2
        container_name: kibana-rag-local
        environment:
            - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
            - SERVER_NAME=kibana-chatvia-local
            - SERVER_HOST=0.0.0.0
            - LOGGING_LEVEL=info  # More verbose for development
            - xpack.security.enabled=false

        ports:
            - "5601:5601"

        networks:
            - chatvia

        depends_on:
            - elasticsearch

        restart: unless-stopped

        deploy:
            resources:
                limits:
                    memory: 1G
                reservations:
                    memory: 512M

networks:
    chatvia:
        driver: bridge

volumes:
    chatvia-mysql:
        driver: local
    chatvia-redis:
        driver: local
    chatvia-minio:
        driver: local
    chatvia-elasticsearch:
        driver: local
