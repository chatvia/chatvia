name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:
  workflow_dispatch:

# Read-only token, and no secrets anywhere in this workflow, so it runs the same
# for pull requests from forks. `packages: read` pulls the Postgres image from
# the GitHub Container Registry.
permissions:
  contents: read
  packages: read

# A new push to the same pull request cancels its older run. A run on a branch
# gets a group of its own, so it is never cancelled and never waits for an
# older run to finish. The group includes the caller's workflow name, so a run
# started through workflow_call never cancels a normal run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.5']

    services:
      postgres:
        # Same image and tag as docker-compose.yml; keep them in sync.
        # Built by .github/workflows/postgres-image.yml (pgvector + pg_textsearch).
        image: ghcr.io/chatvia/postgres:18-r1
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: chatvia
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U chatvia -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_pgsql, intl, gd, exif, iconv, fileinfo, redis
          coverage: none
          tools: composer:v2

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      # The programs Chatvia reads knowledge files with, as the Dockerfile
      # installs them. The tests that need one skip without it, so without
      # this step CI would never run them. The Ubuntu mirror is sometimes very
      # slow (91 MB once took 38 minutes), so the downloaded packages are
      # cached per runner image. apt then fetches only what a package update
      # changed.
      - name: Get runner image version
        id: runner-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore file reader packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: ${{ runner.os }}-${{ runner.arch }}-apt-file-readers-${{ steps.runner-image.outputs.version }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-apt-file-readers-

      - name: Install file readers
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            poppler-utils pandoc catdoc ffmpeg
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives

      # Saved right away rather than at the end of the job, so a run whose
      # checks fail still keeps the packages for the next one.
      - name: Save file reader packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Create storage directories
        run: |
          mkdir -p storage/framework/cache
          mkdir -p storage/framework/sessions
          mkdir -p storage/framework/views
          mkdir -p storage/framework/testing
          mkdir -p storage/logs
          mkdir -p bootstrap/cache

      - name: Copy environment file
        run: cp .env.testing .env

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
         node-version: '22'
         cache: 'npm'

      - name: Install NPM dependencies
        run: npm ci

      - name: Prepare Laravel Application
        run: |
          php artisan key:generate --force
          php artisan key:generate --force --env=testing

      # Every gate a maintainer runs locally before a push: composer
      # validate + audit, npm audit, Pint, Rector, PHPStan, Prettier, ESLint,
      # vue-tsc, Vitest, the i18n check and the Pest suite. It never changes files. The
      # test run installs the Postgres extensions, migrates and seeds the
      # `testing` database by itself, so there is no separate migrate step.
      # The suite runs in parallel, one process per core; each process tests
      # against its own copy of `testing` (testing_test_1, …).
      - name: Run CI checks
        run: composer ci:check

      - name: Build assets
        run: npm run build

  scripts:
    name: Shell scripts and workflows
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # install.sh is built from installer/src and installer/templates: the
      # committed file must be what they build.
      - name: Installer is built
        run: installer/build --check

      # The installer, its build script and the auto-update script it writes,
      # the management tool it copies next to an install, and the scripts
      # inside the image. ShellCheck comes with the runner.
      - name: ShellCheck
        run: shellcheck install.sh installer/build installer/templates/chatvia-auto-update.sh docker/manage docker/app/bin/* docker/app/entrypoint.d/*.sh

      # The workflow files themselves: expressions, job references and the
      # shell in each run step.
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  bash-3:
    name: Installer on bash 3.2
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # macOS still ships bash 3.2 as /bin/bash, and the installer and the
      # management tool run on it there. This only parses them: it catches
      # syntax that needs a newer bash, not every runtime difference.
      - name: Parse with bash 3.2
        run: |
          /bin/bash --version
          /bin/bash -n install.sh
          /bin/bash -n docker/manage
