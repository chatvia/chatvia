name: Shakomako

# Lint, test and build Shakomako, the embeddable chat widget (shakomako/). It
# has its own package.json and toolchain, so it runs apart from the main test
# workflow and only when widget files change.
on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'shakomako/**'
      - '.github/workflows/shakomako.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'shakomako/**'
      - '.github/workflows/shakomako.yml'
  workflow_dispatch:

# Read-only token and no secrets, so it runs the same for pull requests from forks.
permissions:
  contents: read

# A new push to the same pull request cancels its older run.
concurrency:
  group: shakomako-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  shakomako:
    name: Lint, test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: shakomako

    env:
      # The widget's `prepare` script runs husky, which has no git hooks to set
      # up in a subfolder. Skip it.
      HUSKY: '0'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: shakomako/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # With no settings, like the Docker image and the release builds: the
      # widget then finds its server at runtime (see shakomako/README.md).
      - name: Build
        run: npm run build
