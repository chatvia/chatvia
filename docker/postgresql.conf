# PostgreSQL 18 Configuration for ChatVia (Docker-optimized)
# Optimized for vector similarity search with pgvector/VectorChord

# ==========================================
# MEMORY SETTINGS (Adjust based on container resources)
# ==========================================

# Shared buffers: 25% of available container memory
shared_buffers = 2GB

# Effective cache: Including OS cache
effective_cache_size = 6GB

# Work memory per operation
work_mem = 64MB

# Maintenance operations (VACUUM, CREATE INDEX, etc.)
maintenance_work_mem = 512MB

# Temporary file limit per query
temp_file_limit = 2GB

# ==========================================
# CPU & PARALLELISM
# ==========================================

# Maximum worker processes
max_worker_processes = 8

# Parallel query workers
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_parallel_maintenance_workers = 4

# Background writer
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# ==========================================
# CONNECTION SETTINGS
# ==========================================

# Connection limit
max_connections = 100

# Reduce connection overhead
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 10

# ==========================================
# WRITE-AHEAD LOG (WAL)
# ==========================================

# WAL configuration
wal_buffers = 16MB
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# Checkpoint tuning
checkpoint_timeout = 10min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 1GB

# ==========================================
# QUERY PLANNER
# ==========================================

# Cost settings (optimized for SSD)
random_page_cost = 1.1
effective_io_concurrency = 200
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# JIT compilation
jit = on
jit_above_cost = 100000
jit_inline_above_cost = 500000
jit_optimize_above_cost = 500000

# ==========================================
# VECTOR-SPECIFIC SETTINGS
# ==========================================

# Enable parallel operations
enable_parallel_append = on
enable_parallel_hash = on

# ==========================================
# VACUUM & AUTOVACUUM
# ==========================================

# Autovacuum settings
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_limit = 500

# ==========================================
# LOGGING & MONITORING
# ==========================================

# Logging
log_min_duration_statement = 1000
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0

# Shared preload libraries
shared_preload_libraries = 'pg_stat_statements'

# pg_stat_statements
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# ==========================================
# STATISTICS
# ==========================================

# Statistics target
default_statistics_target = 100

# Track activity
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all

# ==========================================
# LOCALE & FORMATTING
# ==========================================

# Set locale (adjust as needed)
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'

# Timezone
timezone = 'UTC'

# ==========================================
# DOCKER-SPECIFIC SETTINGS
# ==========================================

# Listen on all interfaces in Docker
listen_addresses = '*'

# Allow connections from all IPs (use Docker network security instead)
# This is configured via pg_hba.conf

# Data directory (let Docker manage this for PostgreSQL 18)
# data_directory is set automatically by the Docker entrypoint

# ==========================================
# PERFORMANCE TUNING NOTES
# ==========================================
# 
# For production with more resources, adjust:
# - shared_buffers: 8-16GB for 32GB+ RAM
# - effective_cache_size: 24-48GB for 32GB+ RAM
# - work_mem: 128-256MB for heavy queries
# - max_connections: Use PgBouncer for connection pooling

