# ChatVia.ai: the whole stack in Docker. Web app, queue workers, scheduler,
# WebSocket server, server stats, PostgreSQL (with the search extensions) and
# Redis.
#
#   docker compose up -d          start (the first start sets everything up)
#   docker compose logs migrate   the first admin's password, on the first start
#   docker compose ps             show the services and their health
#   docker compose down           stop (data is kept)
#
# To upgrade, change CHATVIA_VERSION in .env, then run
# `docker compose pull && docker compose up -d` (or use ./manage upgrade).
#
# Then open http://localhost:8000.
#
# Built-in HTTPS: with COMPOSE_PROFILES=https and CHATVIA_DOMAIN in .env, the
# proxy service (Caddy) takes ports 80 and 443, gets a Let's Encrypt
# certificate for CHATVIA_DOMAIN, and one for each agent's custom domain the
# first time it is opened (./manage https on sets it all up). A server with
# no domain name can use COMPOSE_PROFILES=self-signed, CHATVIA_IP and
# CHATVIA_HTTPS_PORT instead: HTTPS on its IP address, with a certificate
# browsers warn about. Without either, put your own proxy in front of
# APP_PORT.
#
# The installer (install.sh) also puts `manage` next to this file, for the
# everyday work: ./manage start, stop, backup, restore and more (./manage
# help). Your own changes go in compose.override.yaml, which upgrades never
# replace; the installer keeps PostgreSQL's settings file there.
#
# Settings go in a .env file next to this file (see .env.example). Values like
# the database name and password, and the first admin, are only read on the
# first start. Everything else applies on the next `docker compose up -d`.
#
# This file is for running ChatVia.ai. To work on the code, use the
# docker-compose.yml in the project root (database, Redis and Mailpit only).

name: chatvia

# Container output (docker compose logs) is rotated: at most 5 files of 10 MB
# per container, so a busy install cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

# The app runs as www-data and needs no Linux capabilities, and nothing in it
# may gain more rights (setuid programs).
x-app: &app
  image: ${CHATVIA_IMAGE:-ghcr.io/chatvia/chatvia}:${CHATVIA_VERSION:-latest}
  restart: unless-stopped
  logging: *logging
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  # Any app setting from the project's .env.example can go in this .env file.
  env_file:
    - path: .env
      required: false
  volumes:
    - storage:/var/www/chatvia/storage
    - secrets:/var/lib/chatvia:ro

x-depends-on-migrate: &depends-on-migrate
  migrate:
    condition: service_completed_successfully
  postgres:
    condition: service_healthy
  redis:
    condition: service_healthy

services:
  # One-shot: creates APP_KEY, the database password and the other secrets
  # of this install, once.
  setup:
    <<: *app
    command: ["chatvia-setup"]
    restart: "no"
    volumes:
      - secrets:/var/lib/chatvia

  postgres:
    # PostgreSQL 18 with pgvector, pg_textsearch and pg_partman
    # (docker/postgres/Dockerfile). The moving `18` tag, so an install or
    # upgrade always gets the newest build. The image's default command
    # preloads pg_textsearch, so do not override `command`.
    image: ghcr.io/chatvia/postgres:18
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      setup:
        condition: service_completed_successfully
    environment:
      POSTGRES_DB: ${DB_DATABASE:-chatvia}
      POSTGRES_USER: ${DB_USERNAME:-chatvia}
      POSTGRES_PASSWORD_FILE: /var/lib/chatvia/db-password
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql
      - secrets:/var/lib/chatvia:ro
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:8.10-alpine
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot, on every start: migrations, the AI model list, the first admin
  # and the built-in tools.
  migrate:
    <<: *app
    command: ["chatvia-migrate"]
    restart: "no"
    # Also from the shell, so an installer can pass the first admin's
    # password for one start without writing it to .env. A value in .env
    # still works: Compose reads .env for ${...} too.
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Web app: nginx + PHP-FPM. Also forwards browser WebSocket connections
  # (/app/) to Reverb, so only this one port needs to be published.
  # APP_BIND_IP=127.0.0.1 keeps it on this machine, for a proxy in front.
  app:
    <<: *app
    ports:
      - "${APP_BIND_IP:+${APP_BIND_IP}:}${APP_PORT:-8000}:8080"
    depends_on: *depends-on-migrate

  # Built-in HTTPS (the https profile): Caddy on ports 80 and 443 in front of
  # the app. Its certificates are kept in caddy_data; backups leave them out,
  # as Caddy gets them again by itself.
  proxy: &proxy
    image: caddy:2.11-alpine
    profiles: [https]
    restart: unless-stopped
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    healthcheck:
      # Caddy's admin endpoint; /metrics is the one it does not log.
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:2019/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # HTTPS on this server's IP address (the self-signed profile), for a server
  # with no domain name: Caddy answers on CHATVIA_HTTPS_PORT with a
  # certificate from its own authority, which browsers warn about until they
  # trust it (./manage https ca). Custom domains need the https profile.
  proxy-self-signed:
    <<: *proxy
    profiles: [self-signed]
    ports:
      - "${CHATVIA_HTTPS_PORT:-443}:443"
    configs:
      - source: caddyfile-self-signed
        target: /etc/caddy/Caddyfile

  # The command services run with a small init process: it passes on the stop
  # signal and reaps finished child processes (the scheduler's background
  # tasks, for example), which PHP as process 1 would leave behind. The web
  # container has its own (s6).
  horizon:
    <<: *app
    command: ["php", "artisan", "horizon"]
    init: true
    stop_signal: SIGTERM
    stop_grace_period: 60s
    depends_on: *depends-on-migrate
    healthcheck:
      test: ["CMD", "healthcheck-horizon"]
      start_period: 30s

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    init: true
    stop_signal: SIGTERM
    depends_on: *depends-on-migrate
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 30s

  reverb:
    <<: *app
    command: ["php", "artisan", "reverb:start"]
    init: true
    stop_signal: SIGTERM
    depends_on: *depends-on-migrate
    healthcheck:
      test: ["CMD", "healthcheck-reverb"]
      start_period: 30s

  # Pulse's server stats (/pulse): CPU, memory and disk of this machine, and
  # the open Reverb connections, every 15 seconds. PULSE_SERVER_NAME is the
  # name on the Servers card; without it, each new container would show up as
  # another server.
  pulse:
    <<: *app
    command: ["php", "artisan", "pulse:check"]
    init: true
    environment:
      PULSE_SERVER_NAME: ${PULSE_SERVER_NAME:-chatvia}
    stop_signal: SIGTERM
    depends_on: *depends-on-migrate
    healthcheck:
      test: ["CMD", "pgrep", "-f", "pulse:check"]
      start_period: 30s

# Caddy's settings for the proxy service. A custom domain gets a certificate
# only when the app says it is a saved agent domain (the ask), so a name that
# merely points here never does.
configs:
  caddyfile:
    content: |
      {
      	on_demand_tls {
      		ask http://app:8080/custom-domains
      	}
      }

      ${CHATVIA_DOMAIN:-localhost} {
      	reverse_proxy app:8080
      }

      # Every other name that points here: an agent's custom domain.
      https:// {
      	tls {
      		on_demand
      	}
      	reverse_proxy app:8080
      }

  # The proxy-self-signed service. A browser sends no name when it opens an IP
  # address, so default_sni picks the certificate. It lasts a year and is
  # signed by the root itself: browsers remember a click-through per
  # certificate, so Caddy's usual 12-hour one would bring the warning back
  # all day. No redirect from port 80, as people open the HTTPS port itself.
  caddyfile-self-signed:
    content: |
      {
      	default_sni ${CHATVIA_IP:-127.0.0.1}
      	auto_https disable_redirects
      	skip_install_trust
      }

      https://${CHATVIA_IP:-127.0.0.1} {
      	tls {
      		issuer internal {
      			lifetime 365d
      			sign_with_root
      		}
      	}
      	reverse_proxy app:8080
      }

volumes:
  storage:
  secrets:
  pgdata:
  redisdata:
  caddy_data:
  caddy_config:
