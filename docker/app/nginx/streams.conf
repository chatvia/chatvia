# Chat answers go to their own PHP-FPM pool (chatvia-streams, port 9001; see
# /usr/local/etc/php-fpm.d/chatvia-streams.conf), so a busy chat cannot take
# the workers that serve dashboard pages. These are the routes that keep a
# worker busy while the model writes: the hosted chat's answers, tool
# approvals and read-aloud audio, the widget's answers, the dashboard's
# analytics chat, and the API's messages.
#
# tests/Unit/Docker/App/Nginx/StreamsConfTest.php checks this pattern against
# the app's routes and the site install.sh writes. The Ubuntu install guide
# holds the same pattern.
#
# The app sends X-Accel-Buffering: no on its event streams, so nginx passes
# each piece on at once.
location ~ ^/(?:chat/[^/]+/(?:stream/[^/]+|tools/[^/]+/resolve|conversations/[^/]+/messages/[^/]+/speech)|widget/stream|my/ask/stream|api/v1/agents/[^/]+/conversations/[^/]+/messages)/?$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass 127.0.0.1:9001;
    fastcgi_buffer_size 32k;
    fastcgi_buffers 16 32k;
    fastcgi_read_timeout 300s;
}
