name: Tests

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_call:
  workflow_dispatch:

# The Pest suite. Read-only token, and no secrets anywhere in this workflow, so it runs the same
# for pull requests from forks. `packages: read` pulls the Postgres image from
# the GitHub Container Registry.
permissions:
  contents: read
  packages: read

# A new push to the same pull request cancels its older run. A run on a branch
# gets a group of its own, so it is never cancelled and never waits for an
# older run to finish. The group includes the caller's workflow name, so a run
# started through workflow_call never cancels a normal run.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pest:
    name: Pest
    runs-on: ubuntu-latest

    services:
      postgres:
        # Same image and tag as docker-compose.yml; keep them in sync.
        # Built by .github/workflows/postgres-image.yml (pgvector + pg_textsearch).
        image: ghcr.io/chatvia/postgres:18-r1
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: chatvia
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U chatvia -d testing"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # The programs Chatvia reads knowledge files with, as the Dockerfile
      # installs them. The tests that need one skip without it, so without
      # this step CI would never run them. The Ubuntu mirror is sometimes very
      # slow (91 MB once took 38 minutes), so the downloaded packages are
      # cached per runner image. apt then fetches only what a package update
      # changed.
      - name: Get runner image version
        id: runner-image
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"

      - name: Restore file reader packages
        id: apt-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/apt-archives
          key: ${{ runner.os }}-${{ runner.arch }}-apt-file-readers-${{ steps.runner-image.outputs.version }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-apt-file-readers-

      - name: Install file readers
        timeout-minutes: 15
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            poppler-utils pandoc catdoc ffmpeg
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$USER" ~/apt-archives

      # Saved right away rather than at the end of the job, so a run whose
      # checks fail still keeps the packages for the next one.
      - name: Save file reader packages
        if: steps.apt-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-cache.outputs.cache-primary-key }}

      - name: Set up the PHP app
        uses: ./.github/actions/setup-php-app

      # The test run installs the Postgres extensions, migrates and seeds the
      # `testing` database by itself, so there is no separate migrate step.
      # One process, on `testing` itself. A runner's few cores, shared with
      # Postgres and Redis, gain next to nothing from a parallel run, which
      # would first build a database per process. Locally, `composer test`
      # still runs in parallel. Pint, Rector, PHPStan, the audits and the
      # frontend checks are jobs of their own in the other workflows, side
      # by side with this one.
      - name: Pest
        run: php -d memory_limit=2G artisan test --compact
