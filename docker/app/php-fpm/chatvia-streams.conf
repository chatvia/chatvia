; A second PHP-FPM pool, for chat answers. Each answer keeps its worker busy
; until the model stops writing, so a busy chat could otherwise take every
; worker and leave dashboard pages waiting. nginx sends the streaming routes
; here (/etc/nginx/server-opts.d/streams.conf); everything else stays in the
; base image's pool on port 9000.
;
; The settings follow that pool (docker-php-serversideup-pool.conf).
; clear_env = no lets the app see the secrets chatvia-entrypoint exports. The
; container runs as www-data, so the pool sets no user.
;
; dynamic, not ondemand like the base pool: an empty ondemand pool can start
; one worker for two chats that arrive together, and the second chat then
; waits for the whole first answer. Here one worker always waits, and while
; all are busy FPM adds more every second (1, 2, 4 and so on, up to the
; limit). One spare is the most that works with any CHATVIA_STREAM_WORKERS.

[chatvia-streams]
listen = 127.0.0.1:9001
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
pm = dynamic
pm.max_children = ${CHATVIA_STREAM_WORKERS}
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 1
pm.max_requests = ${PHP_FPM_PM_MAX_REQUESTS}
